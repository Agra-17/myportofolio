<div class="experience-delete-trigger">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-experience-{{ experience.id }}"
            aria-label="Hapus {{ experience.title }}"
            title="Hapus Experience">
        Hapus Experience
    </button>
</div>
<div id="delete-experience-{{ experience.id }}"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <p class="experience-delete-modal__eyebrow">Konfirmasi tindakan</p>
        <h2 id="delete-experience-title-{{ experience.id }}">Hapus Experience?</h2>
        <p>Data yang dihapus tidak dapat dikembalikan. Pastikan Anda memang ingin menghapus:</p>
        <strong class="experience-delete-modal__title">{{ experience.title }}</strong>
        <div class="experience-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-{{ experience.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
